name: Dashboard

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile.dashboard"
      - "packages/dashboard/**"
      - "scripts/ci-gantt.ts"
      - "deno.jsonc"
      - "deno.lock"
      - ".dockerignore"
      - ".github/actions/deno-setup/**"
      - ".github/actions/deno-install/**"
      - ".github/workflows/dashboard-image.yml"

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      # The deployment verifier accepts images only from push runs on main.
      - name: Verify the run is a main push
        if: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
        run: |
          echo "The dashboard image publishes only from a push to main." >&2
          exit 1

      - name: Checkout source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Deno
        uses: ./.github/actions/deno-setup

      - name: Install dependencies
        uses: ./.github/actions/deno-install

      - name: Test dashboard
        working-directory: packages/dashboard
        run: deno task test

  publish:
    name: Publish image
    needs: [tests]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      attestations: write
      contents: read
      id-token: write
    env:
      IMAGE: us-central1-docker.pkg.dev/commontools-core/containers/dev-dashboard
    steps:
      - name: Checkout source commit
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: commontools-core
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          token_format: access_token
          create_credentials_file: false

      - name: Login to Artifact Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: us-central1-docker.pkg.dev
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Setup Blacksmith Builder
        uses: useblacksmith/setup-docker-builder@6ff44f8e5255f9d8aa31ef22f7e57a2d926b7da0 # v1

      # These labels are part of the image config covered by the published
      # digest. The infra deployment verifier checks them against the source
      # repository, main branch, and successful GitHub workflow run.
      - name: Build and push dashboard image
        id: build
        uses: useblacksmith/build-push-action@fb9e3e6a9299c78462bfadd0d93352c316adc9b8 # v2
        with:
          context: .
          file: Dockerfile.dashboard
          platforms: linux/amd64
          push: true
          build-args: |
            DASHBOARD_GIT_COMMIT=${{ github.sha }}
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.sha }}
            dev.commontools.provenance.repository=${{ github.repository }}
            dev.commontools.provenance.ref=${{ github.ref }}
            dev.commontools.provenance.event=${{ github.event_name }}
            dev.commontools.provenance.workflow-ref=${{ github.workflow_ref }}
            dev.commontools.provenance.run-id=${{ github.run_id }}
            dev.commontools.provenance.run-attempt=${{ github.run_attempt }}

      - name: Resolve published digest
        id: result
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        shell: bash
        run: |
          [[ "$DIGEST" =~ ^sha256:[a-f0-9]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Attest published image
        id: attestation
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.result.outputs.digest }}

      - name: Report immutable image reference
        env:
          ATTESTATION_URL: ${{ steps.attestation.outputs.attestation-url }}
          DIGEST: ${{ steps.result.outputs.digest }}
        run: |
          {
            echo "### Dashboard image published"
            echo
            echo "- Tag: \`${IMAGE}:${GITHUB_SHA}\`"
            echo "- Digest: \`${IMAGE}@${DIGEST}\`"
            echo "- Attestation: ${ATTESTATION_URL}"
          } >> "$GITHUB_STEP_SUMMARY"
